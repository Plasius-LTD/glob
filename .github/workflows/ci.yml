name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted_head:
    name: Trusted head admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require a repository-owned candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            exit 1
          fi
  build-test:
    needs: trusted_head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:npm
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run pack:check
      - name: Require coverage of each runtime source
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const lcov = readFileSync('coverage/lcov.info', 'utf8');
          const files = readdirSync('src').filter(file => file.endsWith('.cjs')).map(file => 'src/' + file);
          for (const file of files) {
            if (!lcov.split('\n').some(line => line.startsWith('SF:') && (line.endsWith('/' + file) || line === 'SF:' + file))) {
              throw new Error('Missing runtime source coverage: ' + file);
            }
          }
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
  public_artifact_integrity:
    name: Public artifact integrity
    needs: trusted_head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run pack:check
